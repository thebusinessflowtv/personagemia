name: Render Avatar

on:
  workflow_dispatch:
    inputs:
      script:
        description: English script for the presenter
        required: true
        type: string
      audio_path:
        description: Audio path available on the self-hosted runner
        required: true
        type: string
      character_image_path:
        description: Character master image path available on the self-hosted runner
        required: true
        type: string

jobs:
  render:
    # Production avatar generation runs on our GPU machine; GitHub remains the orchestrator.
    runs-on: [self-hosted, linux, gpu, personagemia]
    timeout-minutes: 360
    env:
      PERSONAGEMIA_AVATAR_ENGINE: command
      PERSONAGEMIA_AVATAR_COMMAND: ${{ vars.PERSONAGEMIA_AVATAR_COMMAND }}
      RENDER_SCRIPT: ${{ inputs.script }}
      RENDER_AUDIO: ${{ inputs.audio_path }}
      RENDER_IMAGE: ${{ inputs.character_image_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Render presenter
        shell: bash
        run: |
          personagemia render \
            --script "$RENDER_SCRIPT" \
            --audio "$RENDER_AUDIO" \
            --image "$RENDER_IMAGE"
      - uses: actions/upload-artifact@v4
        with:
          name: personagemia-render
          path: outputs/
          if-no-files-found: error
