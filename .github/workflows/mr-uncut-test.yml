name: Mr Uncut Test Shot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mr-uncut-test.yml'
      - 'app/cli.py'
      - 'app/sync_labs.py'
      - 'assets/mr_uncut_master.jpg'

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PERSONAGEMIA_SYNC_API_KEY: ${{ secrets.SYNC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Verify Sync Labs credential
        run: |
          if [ -z "$PERSONAGEMIA_SYNC_API_KEY" ]; then
            echo 'SYNC_API_KEY is not configured in this repository.'
            exit 2
          fi
      - name: Generate Mr. Uncut 10-second test shot
        run: >-
          personagemia test-shot
          --image "assets/mr_uncut_master.jpg"
          --script "Everybody keeps pretending this is normal. I don't buy it. I'm Mr. Uncut, and I'm going to say exactly what I think."
          --stability 0.22
          --output-name "mr_uncut_10s_test"
